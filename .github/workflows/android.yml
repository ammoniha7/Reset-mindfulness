name: Android checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build, test, and lint
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleDebugAndroidTest lintDebug
      - name: Verify recorded database schema
        run: git diff --exit-code -- app/schemas
